<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>标准中国象棋棋盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f5f0e6}
/* 落子坐标：x=col*60,y=row*60 col0-8 row0-9 */
.board-wrapper{border:10px solid #7a4b20;border-radius:4px;padding:24px 30px;background:#e6d2b3;box-shadow:0 6px 15px rgba(0,0,0,0.25)}
.chess-board{width:486px;height:546px;position:relative;background:linear-gradient(to right,rgba(230,210,179,0.95),rgba(230,210,179,0.95)),repeating-linear-gradient(to bottom,#e0ccac 0,#e0ccac 1px,transparent 1px,transparent 8px);background-size:100% 100%,100% 8px;border:2px solid #5a3921}
.board-line{position:absolute;background:#5a3921}
.v-line{width:2px;top:0;height:240px}
.v-line.bottom{top:300px}
.v-line.full{height:100%}
.h-line{left:0;width:100%;height:2px}
.river{position:absolute;top:240px;left:0;right:0;height:60px;display:flex;justify-content:space-around;align-items:center;font-family:"楷体",serif;font-size:28px;font-weight:bold;color:#5a3921;letter-spacing:14px}
.river span:last-child{transform:rotate(180deg)}
/* 九宫：linear-gradient 画完整米字 */
.palace{position:absolute;width:120px;height:120px;background:linear-gradient(-45deg,transparent calc(50% - 1px),#5a3921 calc(50% - 1px),#5a3921 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(45deg,transparent calc(50% - 1px),#5a3921 calc(50% - 1px),#5a3921 calc(50% + 1px),transparent calc(50% + 1px))}
.palace-top{top:0;left:180px}
.palace-bottom{top:420px;left:180px}
</style></head><body>
<div class="board-wrapper"><div class="chess-board">
<div class="board-line v-line full" style="left:0"></div><div class="board-line v-line full" style="left:480px"></div>
<div class="board-line v-line" style="left:60px"></div><div class="board-line v-line" style="left:120px"></div><div class="board-line v-line" style="left:180px"></div><div class="board-line v-line" style="left:240px"></div><div class="board-line v-line" style="left:300px"></div><div class="board-line v-line" style="left:360px"></div><div class="board-line v-line" style="left:420px"></div>
<div class="board-line v-line bottom" style="left:60px"></div><div class="board-line v-line bottom" style="left:120px"></div><div class="board-line v-line bottom" style="left:180px"></div><div class="board-line v-line bottom" style="left:240px"></div><div class="board-line v-line bottom" style="left:300px"></div><div class="board-line v-line bottom" style="left:360px"></div><div class="board-line v-line bottom" style="left:420px"></div>
<div class="board-line h-line" style="top:0"></div><div class="board-line h-line" style="top:60px"></div><div class="board-line h-line" style="top:120px"></div><div class="board-line h-line" style="top:180px"></div><div class="board-line h-line" style="top:240px"></div><div class="board-line h-line" style="top:300px"></div><div class="board-line h-line" style="top:360px"></div><div class="board-line h-line" style="top:420px"></div><div class="board-line h-line" style="top:480px"></div><div class="board-line h-line" style="top:540px"></div>
<div class="palace palace-top"></div><div class="palace palace-bottom"></div>
<div class="river"><span>楚河</span><span>汉界</span></div>
</div></div></body></html>
